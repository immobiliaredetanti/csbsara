<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Centro Sanitario Bregaglia">
  <g fill="none" stroke="#a2917a" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground line -->
    <path d="M24 171 H176" stroke-width="4.2"/>
    <!-- trunk -->
    <path d="M100 170 V98" stroke-width="12"/>
    <!-- small offshoot on the trunk -->
    <path d="M100 138 q10 5 7 18" stroke-width="3.2"/>
    <!-- central crown split -->
    <path d="M100 104 V80" stroke-width="8"/>
    <path d="M100 92 Q100 74 92 62" stroke-width="4.5"/>
    <path d="M100 92 Q100 74 108 62" stroke-width="4.5"/>

    <!-- LEFT HALF (mirrored to the right) -->
    <g>
      <!-- upper branch -->
      <path d="M100 96 Q84 84 79 64" stroke-width="5.5"/>
      <path d="M83 76 Q77 72 73 62" stroke-width="3"/>
      <!-- mid branch -->
      <path d="M99 108 Q78 98 62 84" stroke-width="6"/>
      <path d="M74 92 Q66 88 60 79" stroke-width="3.2"/>
      <!-- low branch -->
      <path d="M99 124 Q76 120 58 106" stroke-width="5.6"/>
      <path d="M70 113 Q62 111 55 103" stroke-width="3"/>
      <!-- lowest drooping branch -->
      <path d="M99 136 Q82 137 69 128" stroke-width="4.6"/>
    </g>
    <g transform="translate(200,0) scale(-1,1)">
      <path d="M100 96 Q84 84 79 64" stroke-width="5.5"/>
      <path d="M83 76 Q77 72 73 62" stroke-width="3"/>
      <path d="M99 108 Q78 98 62 84" stroke-width="6"/>
      <path d="M74 92 Q66 88 60 79" stroke-width="3.2"/>
      <path d="M99 124 Q76 120 58 106" stroke-width="5.6"/>
      <path d="M70 113 Q62 111 55 103" stroke-width="3"/>
      <path d="M99 136 Q82 137 69 128" stroke-width="4.6"/>
    </g>
  </g>

  <!-- leaves (taupe filled ovate shapes) -->
  <g fill="#a2917a">
    <!-- central top leaves -->
    <ellipse cx="90" cy="59" rx="6" ry="3.4" transform="rotate(-38 90 59)"/>
    <ellipse cx="110" cy="59" rx="6" ry="3.4" transform="rotate(38 110 59)"/>
    <ellipse cx="100" cy="74" rx="5" ry="3" transform="rotate(0 100 74)"/>
    <!-- left leaves -->
    <ellipse cx="76" cy="60" rx="6.5" ry="3.6" transform="rotate(-52 76 60)"/>
    <ellipse cx="70" cy="59" rx="5.5" ry="3.2" transform="rotate(-20 70 59)"/>
    <ellipse cx="57" cy="80" rx="6.5" ry="3.6" transform="rotate(-16 57 80)"/>
    <ellipse cx="55" cy="101" rx="6.5" ry="3.6" transform="rotate(20 55 101)"/>
    <ellipse cx="52" cy="106" rx="5.5" ry="3.2" transform="rotate(60 52 106)"/>
    <ellipse cx="66" cy="130" rx="6" ry="3.4" transform="rotate(28 66 130)"/>
    <!-- right leaves (mirror) -->
    <ellipse cx="124" cy="60" rx="6.5" ry="3.6" transform="rotate(52 124 60)"/>
    <ellipse cx="130" cy="59" rx="5.5" ry="3.2" transform="rotate(20 130 59)"/>
    <ellipse cx="143" cy="80" rx="6.5" ry="3.6" transform="rotate(16 143 80)"/>
    <ellipse cx="145" cy="101" rx="6.5" ry="3.6" transform="rotate(-20 145 101)"/>
    <ellipse cx="148" cy="106" rx="5.5" ry="3.2" transform="rotate(-60 148 106)"/>
    <ellipse cx="134" cy="130" rx="6" ry="3.4" transform="rotate(-28 134 130)"/>
  </g>
</svg>
